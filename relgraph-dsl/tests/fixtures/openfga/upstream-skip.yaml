# Reviewed exceptions for the pinned openfga/language corpora.
# Checked by `cargo test -p relgraph_dsl --test upstream_corpus`; see the
# module docs of tests/upstream_corpus.rs and CONFORMANCE_PLAN.md.
# Keep sorted and canonical; the test prints the expected form on mismatch.
entries:
- case: dsl-semantic-validation-cases.yaml::duplicate in type name
  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: upstream expects [duplicated-error]; Relgraph validation [DuplicateType, DuplicateRelation, UnknownTuplesetRelation]. Both reject the duplicate type; upstream stops at it, while Relgraph also reports follow-on issues (DuplicateRelation, UnknownTuplesetRelation) from the relations of the second `account` block
- case: dsl-semantic-validation-cases.yaml::model 1.1 should raise error if none of the children has such relation
  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: upstream expects [invalid-relation-on-tupleset x4]; Relgraph validation [UnknownComputedRelation, UnknownComputedRelation]. Both reject for the same rule; upstream reports one error per tupleset target type that lacks the relation, Relgraph one per tuple-to-userset reference (diagnostic granularity only)
- case: dsl-syntax-validation-cases.yaml::valid syntax (1)
  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: 'upstream accepts; Relgraph validation [EmptyModel]. The model declares no type; `validate_schema` rejects it as EmptyModel, matching the OpenFGA API (`WriteAuthorizationModelRequest.type_definitions` has `min_items: 1`), while the language validator accepts it'
- case: 'dsl-syntax-validation-cases.yaml::valid syntax (2): comment preceding model'
  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: 'upstream accepts; Relgraph validation [EmptyModel]. The model declares no type; `validate_schema` rejects it as EmptyModel, matching the OpenFGA API (`WriteAuthorizationModelRequest.type_definitions` has `min_items: 1`), while the language validator accepts it'
- rule: fga-mod-json-output
  reason: unsupported-feature
  tag: json-model
  task: permanent
  justification: Relgraph has no OpenFGA JSON model output, so the expected `json` of fga.mod transformer cases is not compared (plan Task 2 step 4; revisit if Decision D3 adopts JSON models).
