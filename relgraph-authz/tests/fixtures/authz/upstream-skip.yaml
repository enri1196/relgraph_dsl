entries:
- case: abac_tests.yaml::condition_bound_to_correct_type_restriction_facet::1::listObjects::0
  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: 'S4g: upstream expects error 2000 (validation_error) for a contextual tuple whose condition isOk sits on a type restriction facet that does not declare it (user:alice on [user, user:* with isOk, ...]); Relgraph errors InvalidContextualTuple (2027, Model(InvalidTuple("tuple subject is incompatible with the relation restriction"))), as upstream Check does for the same tuple (check::0 expects 2027)'
