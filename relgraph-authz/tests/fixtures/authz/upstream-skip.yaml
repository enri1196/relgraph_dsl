  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: 'S4f: upstream expects error 2000 because ListUsers evaluates every branch it expands and one lacks its condition parameter (document:1#viewer through folder:a with str_cond(s) and folder:b with xcond(x), one parameter supplied), although upstream Check allows the same inputs (check::1, check::2); Relgraph decides the candidate with the check path, where the allowing branch masks the other branch''s error, and lists [user:jon]'
