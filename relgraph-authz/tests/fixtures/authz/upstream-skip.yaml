- case: consolidated_1_1_tests.yaml::false_butnot_cycle_return_false::0
  reason: semantic-divergence
  tag: deliberate
  task: permanent
  justification: 'S2: upstream accepts the model; Relgraph rejects a cycle through a `but not` subtracted operand (RecursiveDifference); the stage''s checks are not run. The evaluator''s least-fixed-point memoization is sound only because construction rejects negation cycles (AGENTS.md). This model''s rejection is pinned by tests/authz_recursion.rs::upstream_negation_cycle_models_are_rejected_at_construction'
