[package]
name = "relgraph-authz-postgres"
version = "0.1.0"
edition = "2024"
description = "PostgreSQL relationship storage for relgraph-authz"
license = "MIT OR Apache-2.0"

[dependencies]
relgraph-authz = { path = "../relgraph-authz", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
