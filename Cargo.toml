[package]
name = "openfga_dsl"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["openfga-authz"]
default-members = [".", "openfga-authz"]
resolver = "3"

[dependencies]
nom = "8.0.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
